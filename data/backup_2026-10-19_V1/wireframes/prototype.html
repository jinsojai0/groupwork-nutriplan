<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriPlan Wireframe Prototype</title>
<style>
:root{
  --ink:#1f2937; --mute:#6b7280; --line:#c7ccd4; --soft:#f3f4f6; --soft2:#e5e7eb; --bg:#ffffff;
  --accent:#374151; --ok:#166534; --warn:#92400e; --bad:#991b1b;
  --k-layout:#2563eb; --k-page:#111827; --k-common:#059669; --k-feature:#d97706; --k-data:#7c3aed;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Sarabun","Garuda","Loma","Tahoma",system-ui,sans-serif;font-size:15px;line-height:1.45}
a{color:inherit}
button{font:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:16px;max-width:1120px;width:100%;margin:0 auto}
h1{font-size:22px;margin:4px 0 10px} h2{font-size:17px;margin:18px 0 8px} h3{font-size:15px;margin:0 0 4px}
.muted{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.box{border:1.5px solid var(--line);border-radius:var(--r);padding:12px;background:#fff}
.img{background:repeating-linear-gradient(45deg,var(--soft) 0 10px,#fafafa 10px 20px);border:1.5px solid var(--line);
  border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--accent);
  background:var(--accent);color:#fff;border-radius:8px;padding:9px 14px;font-weight:600;text-decoration:none;cursor:pointer;min-height:40px}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.block{width:100%}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:#fff;text-decoration:none;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.bad{border-color:var(--bad);color:var(--bad)} .chip.warn{border-color:var(--warn);color:var(--warn)} .chip.ok{border-color:var(--ok);color:var(--ok)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;color:var(--mute)}
.input{border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;min-height:40px;display:flex;align-items:center;justify-content:space-between}
.input.ph{color:#9ca3af}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bar{height:9px;background:var(--soft2);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.bad>i{background:var(--bad)} .bar.warn>i{background:#b45309} .bar.ok>i{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--soft2);padding:7px 6px;text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right}
.icon{width:22px;height:22px;border:1.5px solid var(--mute);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute)}
.skel{background:linear-gradient(90deg,var(--soft) 25%,var(--soft2) 50%,var(--soft) 75%);border-radius:6px}

/* ---------- Header / Nav ---------- */
header.site{border-bottom:1.5px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
header .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;text-decoration:none}
.logo .mark{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent)}
nav.top{display:none;gap:4px}
nav.top a{padding:6px 10px;border-radius:6px;text-decoration:none;font-size:14px}
nav.top a.on{background:var(--soft)}
.hsearch{display:none}
.bottomnav{position:sticky;bottom:0;background:#fff;border-top:1.5px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.bottomnav a{padding:7px 2px 9px;text-align:center;font-size:11px;text-decoration:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
.bottomnav a.on{color:var(--ink);font-weight:700}
footer.site{border-top:1.5px solid var(--line);background:var(--soft);padding:16px;font-size:13px;color:var(--mute)}
footer .in{max-width:1120px;margin:0 auto;display:grid;gap:10px}
@media (min-width:900px){
  nav.top{display:flex} .hsearch{display:block;flex:1;max-width:340px;margin-left:auto}
  .bottomnav{display:none}
  .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  footer .in{grid-template-columns:2fr 1fr 1fr}
  .two{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}
  main{padding:20px 24px}
}

/* ---------- Annotation modes ---------- */
body.lbl-sec [data-sec]{position:relative;outline:1.5px dashed #6b7280;outline-offset:3px}
body.lbl-sec [data-sec]::before{content:attr(data-sec);position:absolute;top:-10px;left:8px;font:600 11px/1.2 "Garuda",system-ui;
  background:#111827;color:#fff;padding:2px 6px;border-radius:4px;z-index:40;white-space:nowrap}
body.lbl-cmp [data-cmp]{position:relative;outline:2px dashed var(--kc,#111);outline-offset:-2px;padding-top:17px!important}
body.lbl-cmp [data-cmp]::after{content:attr(data-cmp);position:absolute;top:2px;left:2px;font:700 10.5px/1.2 ui-monospace,Menlo,monospace;
  background:var(--kc,#111);color:#fff;padding:1px 5px;border-radius:3px;z-index:41;white-space:nowrap}
body.lbl-cmp [data-kind=layout]{--kc:var(--k-layout)} body.lbl-cmp [data-kind=page]{--kc:var(--k-page)}
body.lbl-cmp [data-kind=common]{--kc:var(--k-common)} body.lbl-cmp [data-kind=feature]{--kc:var(--k-feature)}
body.lbl-cmp [data-kind=data]{--kc:var(--k-data)}
body.lbl-cmp .app[data-cmp]{outline-width:3px}

/* ---------- Toolbar (ซ่อนเมื่อถ่ายภาพ) ---------- */
#tb{position:fixed;right:10px;bottom:70px;z-index:99;background:#111827;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;
  display:flex;flex-direction:column;gap:6px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tb select{font:inherit;border-radius:6px;padding:3px}
#tb b{font-size:12px}
body.shot #tb{display:none}
body.shot header.site,body.shot .bottomnav{position:relative}
body.lbl-sec .app{padding-top:30px}
body.lbl-sec main [data-sec]{padding-top:8px}
body.lbl-sec main [data-sec]{margin-top:18px}
body.lbl-sec header.site[data-sec]::before{top:-12px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend span{padding:1px 5px;border-radius:3px;color:#fff;font:700 10px ui-monospace,monospace}
</style>
</head>

<div id="root"></div>

<div id="tb">
  <b>NutriPlan · Wireframe Prototype</b>

  </select></label>

  <label>ผู้ใช้ <select id="tb-user"><option value="member">สมาชิก (เข้าสู่ระบบแล้ว)</option><option value="guest">ผู้ใช้ทั่วไป</option><option value="editor">ผู้ดูแลข้อมูล</option></select></label>

    "article_01": {
      "title_th": "พลังงานที่ร่างกายต้องการต่อวันคำนวณอย่างไร",
      "title_en": "How to Calculate Your Daily Energy Needs",
      "topic": "basic",
      "summary": "อธิบายความหมายของ BMR และ TDEE พร้อมวิธีคำนวณด้วยสมการ Mifflin-St Jeor",
      "key_points": [
        "BMR คือพลังงานที่ร่างกายใช้ขณะพักเพื่อรักษาการทำงานพื้นฐาน เช่น การหายใจและการเต้นของหัวใจ",
        "สมการ Mifflin-St Jeor สำหรับเพศชาย BMR = 10 × น้ำหนัก (กก.) + 6.25 × ส่วนสูง (ซม.) − 5 × อายุ (ปี) + 5 ส่วนเพศหญิงใช้ −161 แทน +5",
        "TDEE คือ BMR คูณตัวคูณระดับกิจกรรม ตั้งแต่ 1.2 สำหรับผู้ที่นั่งทำงานเป็นหลัก ถึง 1.9 สำหรับผู้ใช้แรงงานหนัก",
        "ตัวเลขที่ได้เป็นค่าประมาณเพื่อใช้วางแผน ไม่ใช่ค่าที่วัดได้จริงของแต่ละบุคคล"
      ],

      "related_nutrient": "energy_kcal",

      "cover_image": "images/articles/article_01_cover.webp",

      "published_at": "2026-09-20"
    },
    "article_02": {
      "title_th": "อ่านฉลากโภชนาการอย่างไรให้เป็น",
      "title_en": "How to Read a Nutrition Label",
      "topic": "basic",
      "summary": "อธิบายหน่วยบริโภค ร้อยละของปริมาณที่แนะนำต่อวัน และฉลากหวาน มัน เค็ม",
      "key_points": [
        "ค่าบนฉลากโภชนาการเป็นค่าต่อหนึ่งหน่วยบริโภค ไม่ใช่ต่อทั้งบรรจุภัณฑ์ จึงต้องดูจำนวนหน่วยบริโภคต่อภาชนะประกอบทุกครั้ง",
        "ร้อยละของปริมาณที่แนะนำต่อวันบอกว่าหนึ่งหน่วยบริโภคให้สารอาหารคิดเป็นสัดส่วนเท่าใดของความต้องการทั้งวัน",
        "ฉลากหวาน มัน เค็ม ด้านหน้าบรรจุภัณฑ์แสดงพลังงาน น้ำตาล ไขมัน และโซเดียมของทั้งบรรจุภัณฑ์ ช่วยให้เปรียบเทียบสินค้าได้เร็ว",
        "อาหารปรุงสำเร็จหน้าร้านไม่มีฉลาก ระบบนี้จึงแสดงค่าต่อหนึ่งจานแทน"

    "article_03": {

      "title_en": "Hidden Sodium in Thai Single-dish Meals",
      "topic": "sodium",
      "summary": "เปรียบเทียบปริมาณโซเดียมของเมนูยอดนิยมกับเกณฑ์ไม่เกิน 2,000 มิลลิกรัมต่อวัน",
      "key_points": [
        "องค์การอนามัยโลกแนะนำให้ผู้ใหญ่บริโภคโซเดียมไม่เกิน 2,000 มิลลิกรัมต่อวัน ซึ่งเทียบเท่าเกลือประมาณ 5 กรัม",
        "กรมอนามัยรายงานว่าคนไทยได้รับโซเดียมเฉลี่ย 3,636 มิลลิกรัมต่อวัน เกือบสองเท่าของเกณฑ์",
        "โซเดียมส่วนใหญ่มาจากน้ำปลา ซีอิ๊ว ซอสปรุงรส ผงปรุงรส และน้ำซุป ก๋วยเตี๋ยวน้ำหนึ่งชามจึงอาจให้โซเดียมเกือบทั้งวัน",
        "วิธีลดที่ทำได้ทันทีคือไม่ซดน้ำซุปจนหมด ชิมก่อนเติมเครื่องปรุง และสลับเมนูรสจัดกับผัดผักหรือแกงจืด"

<script>
"use strict";
// ============================================================ ข้อมูล (ดึงจากไฟล์ nutriplan-firebase.json จริง)
const DB = JSON.parse(document.getElementById("db").textContent);
const entries = (o) => Object.entries(o || {}).map(([id, v]) => ({ id, ...v }));
const MENUS = entries(DB.menus), CATS = entries(DB.categories).sort((a, b) => a.sort_order - b.sort_order);
const ARTS = entries(DB.articles), LIMITS = entries(DB.nutrient_limits).sort((a, b) => a.sort_order - b.sort_order);
const ACTS = entries(DB.activity_levels).sort((a, b) => a.sort_order - b.sort_order);
const GOALS = entries(DB.health_goals).sort((a, b) => a.sort_order - b.sort_order);
const M = Object.fromEntries(MENUS.map((m) => [m.id, m]));
const CAT = Object.fromEntries(CATS.map((c) => [c.id, c]));

// ============================================================ สถานะของต้นแบบ (จำลองผู้ใช้ที่เข้าสู่ระบบ)
const Q = new URLSearchParams(location.search);
const S = { lbl: Q.get("lbl") || "", state: Q.get("state") || "ok", user: Q.get("user") || "member" };
if (Q.get("shot")) document.body.classList.add("shot");
const PROFILE = { display_name: "กมลชนก", sex: "female", birth_year: 2548, height_cm: 160, weight_kg: 54,
                  activity_id: "act_light", goal_id: "goal_lose", budget_per_day_thb: 150 };
const TODAY = "2026-09-20";
const TODAY_LOGS = [ { id: "log_a", meal_type: "breakfast", menu_id: "menu_016", qty: 1 },
                     { id: "log_b", meal_type: "lunch", menu_id: "menu_008", qty: 1 },
                     { id: "log_c", meal_type: "snack", menu_id: "menu_042", qty: 1 } ];
const FAVS = ["menu_028", "menu_036", "menu_016"];

// ============================================================ ตรรกะที่จะย้ายไป src/utils/ ในการพัฒนาจริง
function calcTargets(p) {                       // utils/nutrition.js
  const age = 2569 - p.birth_year;
  const bmr = 10 * p.weight_kg + 6.25 * p.height_cm - 5 * age + (p.sex === "male" ? 5 : -161);
  const pal = DB.activity_levels[p.activity_id].pal_factor;
  const tdee = bmr * pal;
  const target = tdee + DB.health_goals[p.goal_id].kcal_adjust;
  return { age, bmr: Math.round(bmr), pal, tdee: Math.round(tdee), target: Math.round(target),
           protein: Math.round(p.weight_kg * DB.nutrient_limits.protein_g.limit_value) };
}
const KEYS = ["energy_kcal", "protein_g", "fat_g", "carb_g", "sugar_g", "fiber_g", "sodium_mg"];
function sumNutrients(items) {                  // utils/nutrition.js
  const t = Object.fromEntries(KEYS.map((k) => [k, 0])); t.price_thb = 0;
  for (const it of items) { const m = M[it.menu_id]; for (const k of [...KEYS, "price_thb"]) t[k] += m[k] * (it.qty || 1); }
  return t;
}
function limitFor(key, tg) {                    // เกณฑ์ของแต่ละสารอาหารจาก nutrient_limits
  const l = DB.nutrient_limits[key];
  if (l.limit_type === "personal") return { type: "target", value: tg.target };
  if (l.limit_type === "per_kg") return { type: "min", value: tg.protein };
  return { type: l.limit_type, value: l.limit_value };
}
function evaluate(totals, tg) {                 // คืนค่ารายการคำเตือนพร้อมบทความที่เกี่ยวข้อง
  const out = [];
  for (const l of LIMITS) {
    const lim = limitFor(l.id, tg); const v = totals[l.id];
    if (lim.type === "max" && v > lim.value) out.push({ key: l.id, level: "bad", text: `${l.name_th}เกินเกณฑ์ ${fmt(v - lim.value)} ${U[l.unit]}`, article: l.article_id });
    else if (lim.type === "max" && v > lim.value * 0.85) out.push({ key: l.id, level: "warn", text: `${l.name_th}ใกล้เกินเกณฑ์`, article: l.article_id });
    else if (lim.type === "min" && v < lim.value * 0.6) out.push({ key: l.id, level: "warn", text: `${l.name_th}ยังน้อย ได้ ${fmt(v)} จาก ${fmt(lim.value)} ${U[l.unit]}`, article: l.article_id });
  }
  return out;
}
// utils/planner.js : ค้นหาทุกชุดค่าผสมของ 4 ช่วงมื้อ แล้วเลือก 3 ชุดที่ดีที่สุดและแตกต่างกัน
function mealOptions() {
  const by = (ids) => MENUS.filter((m) => ids.includes(m.category_id));
  const single = (arr) => arr.map((m) => [m.id]);
  const rice = MENUS.find((m) => m.name_en.startsWith("Steamed")), sticky = MENUS.find((m) => m.name_en === "Sticky Rice");
  const mains = by(["cat_rice", "cat_stir", "cat_noodle"]).concat(MENUS.filter((m) => m.category_id === "cat_curry" && /ราดข้าว/.test(m.name_th)));
  const sides = MENUS.filter((m) => m.category_id === "cat_curry" && !/ราดข้าว/.test(m.name_th)).map((m) => [m.id, rice.id]);
  const isaan = by(["cat_isaan"]).map((m) => [m.id, sticky.id]);
  const soy = MENUS.find((m) => m.name_en.startsWith("Low-sugar Soy")), fruit = MENUS.find((m) => m.name_en.startsWith("Mixed Fruit"));
  const food = (arr) => arr.filter((m) => m.energy_kcal > 0);          // ไม่นับน้ำเปล่าเป็นมื้ออาหาร
  return {
    breakfast: single(by(["cat_noodle", "cat_rice", "cat_stir"])).concat([[soy.id, fruit.id]]),
    lunch: single(mains).concat(sides),
    dinner: single(mains).concat(sides, isaan),
    snack: [[]].concat(single(food(by(["cat_drink", "cat_dessert"])))),   // มื้อว่างไม่บังคับ
  };
}
function generatePlans({ target, budget, protein, vegOnly = false, n = 3 }) {
  const opt = mealOptions();
  const okVeg = (ids) => !vegOnly || ids.every((id) => M[id].is_vegetarian);
  for (const k in opt) opt[k] = opt[k].filter(okVeg);
  const sums = (ids) => ids.reduce((a, id) => { const m = M[id]; a.k += m.energy_kcal; a.p += m.protein_g; a.na += m.sodium_mg; a.c += m.price_thb; return a; }, { k: 0, p: 0, na: 0, c: 0 });
  const pre = {}; for (const k in opt) pre[k] = opt[k].map((ids) => ({ ids, s: sums(ids) }));
  const best = [];
  let checked = 0;
  for (const b of pre.breakfast) for (const l of pre.lunch) for (const d of pre.dinner) for (const s of pre.snack) {
    checked++;
    const c = b.s.c + l.s.c + d.s.c + s.s.c; if (c > budget) continue;          // ข้อบังคับ : ไม่เกินงบ
    const k = b.s.k + l.s.k + d.s.k + s.s.k, p = b.s.p + l.s.p + d.s.p + s.s.p, na = b.s.na + l.s.na + d.s.na + s.s.na;
    const score = Math.abs(k - target) / target + Math.max(0, protein - p) / protein * 0.5 + Math.max(0, na - 2000) / 2000 * 2;
    best.push({ slots: { breakfast: b.ids, lunch: l.ids, dinner: d.ids, snack: s.ids }, k, p, na, c, score });
  }
  best.sort((x, y) => x.score - y.score);
  const picked = [];
  const items = (pl) => Object.values(pl.slots).flat();
  for (const cand of best) {                    // ให้แต่ละแผนมีเมนูต่างจากแผนที่เลือกแล้วอย่างน้อย 2 รายการ
    const ci = items(cand);
    if (picked.every((p) => { const pi = items(p); return ci.filter((x) => !pi.includes(x)).length >= 2; })) picked.push(cand);
    if (picked.length === n) break;
  }
  return { plans: picked, checked };
}

    `<h3>ผลการคำนวณ (สมการ Mifflin-St Jeor)</h3>
     <table><tr><td>BMR = 10×${PROFILE.weight_kg} + 6.25×${PROFILE.height_cm} − 5×${tg.age} − 161</td><td class="num"><b>${fmt(tg.bmr)}</b> kcal</td></tr>
     <tr><td>TDEE = BMR × ${tg.pal} (${DB.activity_levels[PROFILE.activity_id].name_th})</td><td class="num"><b>${fmt(tg.tdee)}</b> kcal</td></tr>
     <tr><td>เป้าหมาย = TDEE ${DB.health_goals[PROFILE.goal_id].kcal_adjust} (${DB.health_goals[PROFILE.goal_id].name_th})</td><td class="num"><b>${fmt(tg.target)}</b> kcal</td></tr>
     <tr><td>โปรตีน = ${PROFILE.weight_kg} กก. × 1.0 ก.</td><td class="num"><b>${tg.protein}</b> ก.</td></tr></table>`, "div", 'class="box"');
}
function MealLogList(logs) {
  if (S.state !== "ok") return C("MealLogList", "data", StateView(S.state === "empty" ? "empty" : S.state, "ยังไม่มีบันทึกมื้ออาหารวันนี้"));
  const TH = { breakfast: "เช้า", lunch: "กลางวัน", dinner: "เย็น", snack: "ว่าง" };
  return C("MealLogList", "data", ["breakfast", "lunch", "dinner", "snack"].map((t) => {
    const items = logs.filter((l) => l.meal_type === t);
    return `<div class="box" style="margin-bottom:6px"><div class="row between"><b>${TH[t]}</b><a class="chip" href="#/today" onclick="event.preventDefault()">+ เพิ่ม</a></div>
      ${items.length ? items.map((l) => { const m = M[l.menu_id]; return `<div class="row between" style="margin-top:6px"><span>${Img("", 34, "width:44px;flex:none")}</span><span class="grow">${m.name_th}<br><span class="muted">${l.qty} ${m.serving_desc.replace("1 ", "")} · ${m.price_thb} บาท</span></span><span>${m.energy_kcal} kcal</span><span class="chip">ลบ</span></div>`; }).join("") : `<div class="muted" style="margin-top:4px">ยังไม่ได้บันทึก</div>`}</div>`;
  }).join(""));
}
function MealPlanCard(plan, i) {
  const TH = { breakfast: "เช้า", lunch: "กลางวัน", dinner: "เย็น", snack: "ว่าง" };
  const okNa = plan.na <= 2000;
  return C("MealPlanCard", "data", `<div class="row between"><b>แผนที่ ${i + 1}</b><span class="chip ${okNa ? "ok" : "bad"}">${okNa ? "โซเดียมไม่เกินเกณฑ์" : "โซเดียมเกิน " + fmt(plan.na - 2000) + " มก."}</span></div>
    ${Object.entries(plan.slots).map(([k, ids]) => `<div class="row between" style="margin-top:6px"><span class="muted" style="width:52px">${TH[k]}</span><span class="grow">${ids.length ? ids.map((id) => M[id].name_th).join(" + ") : "— ไม่มีมื้อว่าง"}</span><span class="muted">${ids.reduce((a, id) => a + M[id].energy_kcal, 0)} kcal</span></div>`).join("")}
    <table style="margin-top:8px"><tr><td>พลังงานรวม</td><td class="num"><b>${fmt(plan.k)}</b> kcal</td></tr><tr><td>โปรตีน</td><td class="num">${fmt(plan.p)} ก.</td></tr><tr><td>โซเดียม</td><td class="num">${fmt(plan.na)} มก.</td></tr><tr><td>ค่าใช้จ่าย</td><td class="num"><b>${plan.c}</b> บาท</td></tr></table>
    <div class="row" style="margin-top:8px">${C("Button", "common", `<button class="btn sm">บันทึกแผนนี้</button>`)}</div>`, "div", 'class="box" style="margin-bottom:10px"');
}
function Breadcrumb(items) {
  return C("Breadcrumb", "common", `<div class="muted">${items.map(([h, t]) => h ? `<a href="${h}">${t}</a>` : t).join(" › ")}</div>`, "div", sec("Breadcrumb"));
}

   ${C("MenuTable", "data", `<table><tr><th>รหัส</th><th>ชื่อเมนู</th><th>หมวด</th><th class="num">kcal</th><th class="num">Na</th><th>สถานะ</th><th></th></tr>
     ${MENUS.slice(0, 8).map((m) => `<tr><td>${m.id}</td><td>${m.name_th}</td><td>${CAT[m.category_id].name_th}</td><td class="num">${m.energy_kcal}</td><td class="num">${m.sodium_mg}</td><td><span class="chip warn">${m.verification_status}</span></td><td><a class="chip" href="#/admin/menus/${m.id}/edit">แก้ไข</a></td></tr>`).join("")}</table>`, "div", `class="box" style="margin-top:10px" ${sec("Menu Table")}`)}`);
pages.adminForm = (p, id) => {
  const m = id ? M[id] : null;
  const f = (label, val, w = "") => `<div class="field" style="${w}"><label>${label}</label><div class="input ${val === "" ? "ph" : ""}">${val === "" ? "—" : val}</div></div>`;
  const calc = m ? 4 * m.protein_g + 9 * m.fat_g + 4 * m.carb_g : 0;
  return C("AdminMenuFormPage", "page", `${Breadcrumb([["#/admin/menus", "จัดการเมนู"], [null, m ? "แก้ไข " + id : "เพิ่มเมนูใหม่"]])}
   <h1>${m ? "แก้ไขเมนู " + id : "เพิ่มเมนูใหม่"}</h1>
   ${C("MenuForm", "feature", `<div class="two"><div>
      <h2>ข้อมูลทั่วไป</h2><div class="grid2">${f("ชื่อภาษาไทย *", m ? m.name_th : "")}${f("ชื่อภาษาอังกฤษ *", m ? m.name_en : "")}${f("หมวดอาหาร * (categories)", m ? CAT[m.category_id].name_th + " ▾" : "เลือก ▾")}${f("ประเภทร้าน (vendor_types)", m ? DB.vendor_types[m.vendor_type_id].name_th + " ▾" : "เลือก ▾")}${f("หน่วยบริโภค", m ? m.serving_desc : "")}${f("น้ำหนัก (กรัม) *", m ? m.serving_g : "")}${f("ราคา (บาท) *", m ? m.price_thb : "")}${f("ระดับความเผ็ด", m ? m.spicy_level + " ▾" : "0 ▾")}</div>
      ${f("คำค้นเพิ่มเติม (tags)", m ? m.tags.join(", ") : "")}</div>
     <div><h2>ค่าโภชนาการต่อหน่วยบริโภค</h2><div class="grid2">${KEYS.map((k) => f(DB.nutrient_limits[k].name_th + " (" + U[DB.nutrient_limits[k].unit] + ") *", m ? m[k] : "")).join("")}</div>
      <div class="box" style="border-color:var(--warn);margin-bottom:10px"><b>ตรวจสอบอัตโนมัติ</b><br><span class="muted">4P + 9F + 4C = ${fmt(calc)} kcal เทียบกับที่ระบุ ${m ? m.energy_kcal : "—"} kcal (ต้องต่างกันไม่เกิน ±8%)</span></div>
      <div class="grid2">${f("แหล่งข้อมูล * (sources)", m ? m.source_id + " ▾" : "เลือก ▾")}${f("สถานะการสอบทาน", m ? m.verification_status + " ▾" : "PENDING ▾")}</div>
      ${f("ไฟล์ภาพ (กำหนดจากรหัสอัตโนมัติ)", m ? m.image_thumb + " , " + m.image_detail.split("/").pop() : "images/menus/menu_050_thumb.webp")}</div></div>
     <div class="row" style="justify-content:flex-end">${C("Button", "common", `<a class="btn ghost" href="#/admin/menus">ยกเลิก</a>`)}${C("Button", "common", `<button class="btn">บันทึก</button>`)}</div>`, "div", `class="box" ${sec("Menu Form")}`)}`);
};
pages.notfound = () => C("NotFoundPage", "page", `<div style="text-align:center;padding:30px">${Img("illus_not_found.svg", 140, "max-width:260px;margin:0 auto")}<h1>ไม่พบหน้าที่ต้องการ</h1><a class="btn" href="#/">กลับหน้าแรก</a></div>`);

// ============================================================ Router (ตรงกับตาราง Routing ในส่วนที่ 4.5)
const ROUTES = [
  ["P01", /^\/$/, "home", "หน้าแรก", "/"],
  ["P02", /^\/menus$/, "menus", "รายการเมนู", "/menus?category=cat_stir"],
  ["P03", /^\/search$/, "search", "ผลการค้นหา", "/search?q=กะเพรา"],
  ["P04", /^\/menus\/(menu_\d{3})$/, "menu", "รายละเอียดเมนู", "/menus/menu_007"],
  ["P05", /^\/login$/, "login", "เข้าสู่ระบบ", "/login"],
  ["P06", /^\/profile$/, "profile", "โปรไฟล์และเป้าหมาย", "/profile"],
  ["P07", /^\/today$/, "today", "บันทึกวันนี้", "/today"],
  ["P08", /^\/planner$/, "planner", "วางแผนมื้ออาหาร", "/planner"],
  ["P09", /^\/articles$/, "articles", "บทความ", "/articles"],
  ["P10", /^\/articles\/(article_\d{2})$/, "article", "รายละเอียดบทความ", "/articles/article_03"],
  ["P11", /^\/favorites$/, "favorites", "เมนูโปรด", "/favorites"],
  ["P12", /^\/weekly$/, "weekly", "สรุปรายสัปดาห์", "/weekly"],
  ["P13", /^\/admin\/menus$/, "adminMenus", "จัดการเมนู (ผู้ดูแลข้อมูล)", "/admin/menus"],
  ["P14", /^\/admin\/menus\/(?:new|(menu_\d{3})\/edit)$/, "adminForm", "ฟอร์มเพิ่ม/แก้ไขเมนู", "/admin/menus/menu_007/edit"],
];
const PROTECTED = ["profile", "today", "planner", "favorites", "weekly"], EDITOR = ["adminMenus", "adminForm"];
function render() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, "") || "/");
  const [path, qs] = raw.split("?");
  const params = Object.fromEntries(new URLSearchParams(qs || ""));
  let route = { key: "notfound" }, arg;
  for (const [code, re, key] of ROUTES) { const mm = path.match(re); if (mm) { route = { code, key }; arg = mm[1]; break; } }
  if (PROTECTED.includes(route.key) && S.user === "guest") route = { key: "login", redirected: true };
  if (EDITOR.includes(route.key) && S.user !== "editor") route = S.user === "guest" ? { key: "login" } : { key: "notfound" };
  const body = (pages[route.key] || pages.notfound)(params, arg);
  document.body.className = (S.lbl ? "lbl-" + S.lbl : "") + (Q.get("shot") ? " shot" : "");
  document.getElementById("root").innerHTML = C("AppLayout", "layout",
    `${Header(route)}<main>${body}</main>${Footer()}${BottomNav(route)}`, "div", 'class="app"');
  window.scrollTo(0, 0);
}
// Toolbar
const tbr = document.getElementById("tb-route");
tbr.innerHTML = ROUTES.map(([c, , , t, ex]) => `<option value="${ex}">${c} ${t}</option>`).join("");
tbr.onchange = () => (location.hash = "#" + tbr.value);
const bind = (id, key) => { const el = document.getElementById(id); el.value = S[key]; el.onchange = () => { S[key] = el.value; render(); }; };
bind("tb-lbl", "lbl"); bind("tb-state", "state"); bind("tb-user", "user");
window.addEventListener("hashchange", render);
render();
</script>
